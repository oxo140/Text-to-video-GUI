name: Windows portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Check code
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test console without GUI dependencies
        run: cargo test --locked --no-default-features --bin text-video-cmd --lib
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
      - name: Package portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Text-Video-Studio-GUI.exe,dist/Text-Video-Studio-CMD.exe,dist/README.md,dist/THIRD_PARTY.md,dist/Ubuntu-FONT-LICENCE.txt,dist/licenses -DestinationPath Text-Video-Studio-Windows.zip
          Copy-Item dist/Text-Video-Studio-GUI.exe,dist/Text-Video-Studio-CMD.exe .
          Get-FileHash Text-Video-Studio-GUI.exe,Text-Video-Studio-CMD.exe,Text-Video-Studio-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Text-Video-Studio-Windows
          path: |
            Text-Video-Studio-Windows.zip
            Text-Video-Studio-GUI.exe
            Text-Video-Studio-CMD.exe
            SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME Text-Video-Studio-Windows.zip Text-Video-Studio-GUI.exe Text-Video-Studio-CMD.exe SHA256SUMS.txt --verify-tag --title "Text Video Studio $env:GITHUB_REF_NAME — GUI et CMD portables" --notes-file RELEASE_NOTES.md
